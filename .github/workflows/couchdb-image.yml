name: CouchDB image
on:
  pull_request:
    paths:
      - Dockerfile
      - local.ini
      - utils/couchdb/**
      - .github/workflows/couchdb-image.yml
  push:
    branches: [main]
    paths:
      - Dockerfile
      - local.ini
      - utils/couchdb/**
      - .github/workflows/couchdb-image.yml
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - run: docker build -t livesync-security-smoke .
      - run: sh utils/couchdb/verify-image.sh livesync-security-smoke
